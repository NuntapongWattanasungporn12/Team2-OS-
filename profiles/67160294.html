<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์นิสิต - นันทพงศ์ วรรธนสังข์พร</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #0056b3;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 20px;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3);
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .student-id {
            font-size: 15px;
            color: #666666;
            margin-bottom: 24px;
        }

        .info-container {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
            border: 1px solid #e9ecef;
        }

        .info-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-size: 13px;
            color: #70757a;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 15px;
            color: #212529;
            word-break: break-all;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: #4a5568;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
        }

        .btn-back:hover {
            background-color: #2d3748;
        }

        .btn-back:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">น</div>
        
        <h1 class="profile-name">นันทพงศ์ วรรธนสังข์พร</h1>
        <p class="student-id">รหัสนิสิต: 67160294</p>

        <div class="info-container">
            <div class="info-row">
                <span class="info-label">ชื่อ - นามสกุล</span>
                <span class="info-value">นันทพงศ์ วรรธนสังข์พร</span>
            </div>
            <div class="info-row">
                <span class="info-label">อีเมลมหาวิทยาลัย</span>
                <span class="info-value">67160294@go.buu.ac.th</span>
            </div>
            <div class="info-row">
    
            </div>
        </div>

        <!-- ปุ่มย้อนกลับโดยใช้ JavaScript history.back() -->
        <button class="btn-back" onclick="history.back()">
            &#8592; ย้อนกลับ
        </button>
    </div>

</body>
</html>
