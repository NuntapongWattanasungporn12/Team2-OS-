<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลนิสิต</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        /* สไตล์สำหรับการ์ดโปรไฟล์ */
        .profile-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
            max-width: 90%;
        }

        /* สไตล์สำหรับไอคอนโปรไฟล์ (วงกลม) */
        .profile-icon {
            width: 100px;
            height: 100px;
            background-color: #007bff;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        /* ปรับขนาดของรูปไอคอน SVG */
        .profile-icon svg {
            width: 55px;
            height: 55px;
            fill: currentColor;
        }

        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: #333333;
            margin: 10px 0 5px 0;
        }

        /* สไตล์สำหรับตำแหน่ง */
        .profile-role {
            font-size: 16px;
            color: #007bff;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .profile-email {
            font-size: 15px;
            color: #6c757d;
            margin-bottom: 30px;
        }

        /* สไตล์ปุ่มกดย้อนกลับ */
        .back-button {
            background-color: #f8f9fa;
            color: #333333;
            border: 1px solid #dee2e6;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- ส่วนของไอคอนโปรไฟล์ -->
        <div class="profile-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
        
        <!-- ส่วนข้อมูลนิสิต -->
        <div class="profile-name">นายจิรันธนิน ผลเกิด</div>
        <div class="profile-role">Development Engineer</div>
        <div class="profile-email">67160123@go.buu.ac.th</div>

        <!-- ปุ่มกดย้อนกลับ -->
        <button class="back-button" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            ย้อนกลับ
        </button>
    </div>

</body>
</html>
